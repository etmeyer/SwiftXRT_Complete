# Documentation site, built from docs/ by .github/workflows/docs.yml and
# published at site_url. Preview locally:
#   pip install mkdocs-material && mkdocs serve
site_name: Swift XRT Pipeline
site_description: Step-by-step documentation for the Swift XRT spectral analysis pipeline
site_url: https://etmeyer.github.io/SwiftXRT_Complete/
repo_url: https://github.com/etmeyer/SwiftXRT_Complete
repo_name: etmeyer/SwiftXRT_Complete
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.footer
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - 1. Setup: 01-setup.md
  - 2. Download data: 02-download.md
  - 3. Run xrtpipeline: 03-xrtpipeline.md
  - 4. Survey observations: 04-survey.md
  - 5. PC-mode inspection: 05-pc-inspection.md
  - 6. WT-mode inspection: 06-wt-inspection.md
  - 7. Extract spectra: 07-extract.md
  - 8. Fit and plot: 08-fit-and-plot.md

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
